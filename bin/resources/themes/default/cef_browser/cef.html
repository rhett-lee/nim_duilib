<html>
<head>
<meta charset="UTF-8" />
<script>
  /* 界面语言：优先使用地址栏参数 lang=zh|en，否则跟随浏览器语言（中文环境显示中文，其他语言显示英文） */
  window.__demoLang = (function () {
    const m = /[?&]lang=(zh|en)/i.exec(location.search)
    if (m) { return m[1].toLowerCase() }
    return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'
  })()
  /* 动态文案：中文用 zh，英文用 en */
  window.__t = function (zh, en) { return window.__demoLang === 'zh' ? zh : en }
  /* 静态文案：英文环境下按字典替换文本节点与 placeholder */
  document.addEventListener('DOMContentLoaded', function () {
    if (window.__demoLang === 'zh') { return }
    const dict = {
      'CEF 控件示例': 'CEF Control Sample',
      '演示如何在 Duilib 中使用 CEF 控件': 'A demo of using the CEF control in Duilib',
      '输入内容发送给 C++ 接收': 'Type a message to send to C++',
      '发送': 'Send'
    }
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false)
    let node
    while ((node = walker.nextNode())) {
      const key = node.nodeValue.trim()
      if (Object.prototype.hasOwnProperty.call(dict, key)) {
        node.nodeValue = node.nodeValue.replace(key, dict[key])
      }
    }
    document.querySelectorAll('[placeholder]').forEach(function (el) {
      const key = (el.getAttribute('placeholder') || '').trim()
      if (Object.prototype.hasOwnProperty.call(dict, key)) { el.setAttribute('placeholder', dict[key]) }
    })
  })
</script>
<script>
  const showMessage = () => {
    const message = document.getElementById('message_input').value
    // 调用一个 C++ 注册过的方法
    NimCefWebInstance.call('ShowMessageBox', { message }, (error, result) => {
      console.log(result)
    })
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
</head>
<body style="overflow: hidden;">
<div class="row">
  <div class="col-sm-6 col-md-6 col-md-offset-3 col-sm-offset-3">
    <h1 class="text-center">CEF 控件示例</h1>
    <h3 class="text-center">演示如何在 Duilib 中使用 CEF 控件</h3>
    <div class="input-group">
      <input type="text" id="message_input" class="form-control" placeholder="输入内容发送给 C++ 接收">
      <span class="input-group-btn">
        <button class="btn btn-default" type="button" onclick="showMessage()">发送</button>
      </span>
    </div><!-- /input-group -->
  </div><!-- /.col-lg-6 -->
</div><!-- /.row -->
</body>
</html>

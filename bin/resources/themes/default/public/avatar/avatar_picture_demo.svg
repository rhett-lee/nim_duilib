<?xml version="1.0" encoding="UTF-8"?>
<!-- Avatar 头像示例图片：由"天空 + 太阳 + 远山 + 草地"构成的照片风格画面
     目的是演示 image 形态的 cover 填充（等比放大铺满头像）与圆形裁剪效果，颜色固定、不参与主题替换 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256px" height="256px">
  <defs>
    <linearGradient id="avatarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A90D9"/>
      <stop offset="0.6" stop-color="#8EC5F0"/>
      <stop offset="1" stop-color="#D6ECFA"/>
    </linearGradient>
    <linearGradient id="avatarGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DA544"/>
      <stop offset="1" stop-color="#3F7A2A"/>
    </linearGradient>
    <linearGradient id="avatarMountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D7A96"/>
      <stop offset="1" stop-color="#34495E"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" fill="url(#avatarSky)"/>
  <circle cx="186" cy="62" r="26" fill="#FFD24A"/>
  <path d="M0 168 L62 96 L120 168 Z" fill="url(#avatarMountain)"/>
  <path d="M86 168 L160 72 L236 168 Z" fill="url(#avatarMountain)"/>
  <path d="M0 168h256v88H0z" fill="url(#avatarGrass)"/>
  <path d="M0 168 L62 96 L120 168 Z" fill="#FFFFFF" opacity="0.10"/>
  <path d="M86 168 L160 72 L236 168 Z" fill="#FFFFFF" opacity="0.08"/>
</svg>

<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- 语言切换图标：地球（外圆 + 经线 + 赤道线）
       外圆半径与"主题切换"图标一致（r=8、描边1.5），使标题栏两个图标视觉大小统一；
       内部经线/赤道线用较细的描边，避免小尺寸下线交叉过于密集 -->
  <circle cx="12" cy="12" r="8" stroke="#333333" stroke-width="1.5" fill="none"/>
  <!-- 经线 -->
  <ellipse cx="12" cy="12" rx="3.4" ry="8" stroke="#333333" stroke-width="1.2" fill="none"/>
  <!-- 赤道线 -->
  <path d="M4.8 12 L19.2 12" stroke="#333333" stroke-width="1.2" fill="none"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- nim_duilib 主Logo：
     蓝色圆角底 + 层叠的窗口/布局图形，表达"跨平台 + XML皮肤 + 可组合控件"的定位；
     整体为纯几何色块，不依赖细线条，在 18px（标题栏）与 56px（欢迎卡片）下均清晰可辨。
     颜色取自项目语义色 color_accent(#0078D4) 的蓝色系，在明暗主题下均有足够对比度。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logo_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4AA3FF"/>
      <stop offset="1" stop-color="#0063C8"/>
    </linearGradient>
  </defs>

  <!-- 圆角底：品牌蓝渐变 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#logo_bg)"/>

  <!-- 后层窗口：暗示多窗口/跨平台 -->
  <rect x="15" y="11" width="39" height="34" rx="5" fill="#FFFFFF" fill-opacity="0.30"/>

  <!-- 前层窗口：一个典型的应用窗体 -->
  <rect x="10" y="17" width="40" height="36" rx="5" fill="#FFFFFF"/>

  <!-- 左侧导航列 -->
  <rect x="15" y="22" width="10" height="26" rx="3" fill="#0078D4"/>

  <!-- 内容区的两个区块：表达可组合的布局与控件 -->
  <rect x="29" y="22" width="16" height="11" rx="3" fill="#5AA9F0"/>
  <rect x="29" y="37" width="16" height="11" rx="3" fill="#BFDCFB"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Popover 卡片尖角：卡片在锚点右侧时使用，尖角向左指向锚点
     图片尺寸 9×16：x=7.2..9 为压入卡片的重叠区（覆盖卡片在该高度内的边线，避免边线横穿尖角），
     卡片边线位于 x=8，尖角尖端位于 x≈0.5
     颜色占位：#FFFFFF 映射为卡片背景色（bg_window_card），#D5D5D5 映射为卡片边线（border_window），
     由引用处的 svg_replace_colors 完成替换，以适配不同颜色主题 -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 9 16" width="9px" height="16px" preserveAspectRatio="none">
  <!-- 压入卡片的部分与尖角填充合并为单一图形：两者共用 x=7.2 的边界，
       分开绘制时在 Retina 等小数缩放下该边界会出现半透明缝隙，露出下方阴影形成一条淡竖线 -->
  <polygon points="9,0 9,16 7.2,16 0.5,8 7.2,0" fill="#FFFFFF" stroke="none"/>
  <!-- 两条斜边描边：起点落在卡片边线上，与卡片边线自然衔接 -->
  <path d="M8,0.5 L0.9,8 L8,15.5" fill="none" stroke="#D5D5D5" stroke-width="1"
        stroke-linejoin="miter" stroke-linecap="butt"/>
</svg>
